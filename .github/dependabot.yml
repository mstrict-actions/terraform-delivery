version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
